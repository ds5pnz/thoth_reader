[package]
name = "thoth-reader"
version = "1.0.0"
description = "Thoth Reader - local-first bilingual PDF/EPUB reader"
edition = "2021"
rust-version = "1.99"
publish = false

[lib]
name = "thoth_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-opener = "=2.7.3"
tokio = { version = "1.54", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "json", "macros"] }
libsqlite3-sys = { version = "=0.37.0", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "v7"] }
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
url = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
html5ever = "0.40"
markup5ever_rcdom = "0.40.1"
cssparser = "0.38"
unicode-normalization = "0.1"
unicode-segmentation = "1"
percent-encoding = "2"
security-framework = "3"
ts-rs = { version = "12", features = ["serde-json-impl"] }
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mime_guess = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[features]
default = []
# WebDriver/test-only tooling must never ship in release builds.
e2e = []

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Dependencies (hashing, zip, html parsing) are optimized even in dev builds so local
# testing reflects realistic import/extraction speed; app code stays debuggable.
[profile.dev.package."*"]
opt-level = 3
