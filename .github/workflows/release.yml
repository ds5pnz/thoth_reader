# Builds the app for macOS and Windows and attaches the installers to the GitHub release
# of a version tag.
#
#   git tag -a v1.2.0 -m "Thoth Reader 1.2.0" && git push origin v1.2.0
#
# The release text comes from docs/releases/<tag>.md when that file exists, otherwise from
# the commits since the previous tag. Run the workflow by hand ("Run workflow") to build
# without publishing: the installers are then only kept as run artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Which builds to run (a tag always runs all of them)
        type: choice
        options: [all, macos, windows, windows-smoke]
        default: all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Apple Silicon)
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'macos'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src-tauri/rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target aarch64-apple-darwin
          (cd src-tauri && rustc --version)

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - run: npm ci

      - name: The tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the app version $version"
            exit 1
          fi

      - name: Frontend tests
        run: npm test

      - name: Build the app and disk image
        run: npm run app:build

      - name: Name and checksum the disk image
        id: pkg
        run: |
          version=$(node -p "require('./package.json').version")
          built=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | head -n 1)
          file="Thoth.Reader_${version}_aarch64.dmg"
          cp "$built" "$file"
          hdiutil verify "$file"
          shasum -a 256 "$file" | tee "$file.sha256"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: thoth-reader-macos-aarch64
          path: |
            ${{ steps.pkg.outputs.file }}
            ${{ steps.pkg.outputs.file }}.sha256
          if-no-files-found: error

  windows:
    name: Windows (x64)
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'windows'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src-tauri/rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          (cd src-tauri && rustc --version)

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - run: npm ci

      - name: The tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the app version $version"
            exit 1
          fi

      - name: Frontend tests
        run: npm test

      # The Windows-specific code (secret store, path rules) is only exercised here.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build the app and installer
        run: npm run app:build:windows

      - name: Name and checksum the installer
        id: pkg
        run: |
          version=$(node -p "require('./package.json').version")
          built=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)
          file="Thoth.Reader_${version}_x64-setup.exe"
          cp "$built" "$file"
          sha256sum "$file" | tee "$file.sha256"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: thoth-reader-windows-x64
          path: |
            ${{ steps.pkg.outputs.file }}
            ${{ steps.pkg.outputs.file }}.sha256
          if-no-files-found: error

  # Manual only: starts the debug build on a Windows runner and lets the built-in self-test
  # import and open the test books and translate through a stand-in server. This is the
  # only place the app is actually run on Windows.
  windows-smoke:
    name: Windows (run the app)
    if: github.event_name == 'workflow_dispatch' && inputs.platforms == 'windows-smoke'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src-tauri/rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-smoke-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-smoke-${{ runner.os }}-${{ runner.arch }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - run: npm ci

      - name: Run the app with the self-test
        env:
          THOTH_SELFTEST_PROVIDER: http://127.0.0.1:18765/v1
          THOTH_SELFTEST_MODEL: mock
          THOTH_SELFTEST_SCENARIO: ${{ vars.SMOKE_SCENARIO }}
        run: |
          python scripts/mock_openai_server.py 18765 5 filler > mock.log 2>&1 &
          export THOTH_DATA_DIR="$(cygpath -w "$RUNNER_TEMP/thoth-data")"
          export THOTH_SELFTEST="$(cygpath -w "$PWD/tests/fixtures/epub/good/normal_epub3.epub");$(cygpath -w "$PWD/tests/fixtures/pdf/single-column.pdf")"
          npx tauri dev > app.log 2>&1 &
          for i in $(seq 1 700); do
            grep -qE 'selftest done|panicked|error\[|error: could not compile' app.log && break
            sleep 3
          done
          echo "---- self-test output"
          grep -E '^\[webview' app.log | cut -c1-4000 || true
          if ! grep -q 'selftest done' app.log; then
            echo "---- last lines of the app log"
            tail -n 60 app.log
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-smoke-logs
          path: |
            app.log
            mock.log
          if-no-files-found: warn

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist-release
          merge-multiple: true

      - name: Create the release or attach to the one written by hand
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes="docs/releases/$tag.md"
          ls -l dist-release
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist-release/* --clobber
          elif [ -f "$notes" ]; then
            gh release create "$tag" dist-release/* --verify-tag --title "Thoth Reader ${tag#v}" --notes-file "$notes"
          else
            gh release create "$tag" dist-release/* --verify-tag --title "Thoth Reader ${tag#v}" --generate-notes
          fi
